spring.application.name=travel-agent
spring.data.redis.host=localhost
spring.data.redis.port=6379

spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2:3b
spring.ai.ollama.embedding.options.model=nomic-embed-text
logging.level.org.springframework.ai=DEBUG

spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.name=travel-agent
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC

travel.security.jwt.secret=${TRAVEL_SECURITY_JWT_SECRET}
travel.security.jwt.ttl=PT1H
travel.security.refresh.ttl=P7D

logging.level.org.springframework.security=DEBUG
logging.levelroot.org.springframework.kafka=DEBUG

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

analytics.base-url=http://localhost:8082


management.endpoints.web.exposure.include=health,circuitbreakers,metrics

resilience4j.circuitbreaker.instances.analytics.sliding-window-size=10
resilience4j.circuitbreaker.instances.analytics.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.analytics.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.analytics.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.instances.analytics.permitted-number-of-calls-in-half-open-state=3